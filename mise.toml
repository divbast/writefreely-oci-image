[tools]
"core:go" = "1.27.4"
"aqua:golangci/golangci-lint" = "2.15.0"

"aqua:hadolint/hadolint" = "2.15.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"aqua:rhysd/actionlint" = "1.7.12"
"pipx:reuse" = "6.3.0"
"aqua:casey/just" = "1.59.0"

"aqua:suzuki-shunsuke/pinact" = "5.0.2"
"aqua:aquasecurity/trivy" = "0.76.2"
# For divbast-scan, in app-check.yml's scan job: grype scans an image
# whose base says ID=dhi, Docker's own model, which Trivy cannot read
"aqua:anchore/grype" = "0.122.1"
"aqua:zizmorcore/zizmor" = "1.32.0"
# For divbast-verify-images, which app-check.yml's build job runs: it
# verifies the distroless runtime's signature
"aqua:sigstore/cosign" = "3.1.4"

[env]
# The toolchain is the one pinned above, never one go.mod's toolchain line
# would download
GOTOOLCHAIN = "local"
# readonly refuses to edit go.mod. The tags are the image's: WriteFreely's
# SQLite exists only under sqlite, and netgo and osusergo keep the static
# binary off libc's resolvers, so lint and tests build what ships.
GOFLAGS = "-mod=readonly -tags=sqlite,netgo,osusergo"
